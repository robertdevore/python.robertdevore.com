<!DOCTYPE html>
<html lang="{{lang}}" data-theme="kujo-light">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{page_title}}</title>
	<meta name="description" content="{{meta_description}}">
	<meta name="keywords" content="{{seo_keywords}}">
	{{canonical_tag}}
	{{favicon_tag}}
	{{rss_link_tag}}
	<meta property="og:title" content="{{seo_title}}">
	<meta property="og:description" content="{{seo_description}}">
	<meta property="og:url" content="{{og_url}}">
	<meta property="og:type" content="{{og_type}}">
	<meta property="og:site_name" content="{{site_title}}">
	<meta property="og:locale" content="{{og_locale}}">
	{{og_image_tag}}
	{{og_article_tags}}
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="{{seo_title}}">
	<meta name="twitter:description" content="{{seo_description}}">
	{{twitter_image_tag}}
	<link href="{{relative_path}}assets/sitekit/sitekit.css" rel="stylesheet">
	<link href="{{stylesheet_path}}" rel="stylesheet">
	{{json_ld}}
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="docs-topbar python-topbar" id="navigation">
	<div class="docs-topbar-row">
		<a class="docs-brand" href="{{home_path}}"><span class="docs-brand-mark" aria-hidden="true">&gt;_</span><span>{{site_title}}</span></a>
		<button class="docs-menu-button" type="button" aria-controls="primary-navigation" aria-expanded="false" aria-label="Open menu" data-docs-menu><span class="docs-menu-label">Menu</span><span class="docs-menu-close-icon" aria-hidden="true"></span></button>
	</div>
	<nav id="primary-navigation" class="docs-primary-nav" aria-label="Primary navigation"><ul>{{navigation}}</ul></nav>
	<label class="docs-search-shell">
		<span class="sr-only">Search the Python course</span>
		<input id="docs-search" type="search" placeholder="Search the course" autocomplete="off">
	</label>
</header>
<div id="docs-search-results" class="docs-search-results" aria-live="polite"></div>
{{content}}
<footer class="docs-footer" id="footer">
	<div><strong>{{site_title}}</strong><span>{{site_tagline}}</span></div>
	<nav aria-label="Footer navigation"><a href="{{relative_path}}course/welcome-to-the-complete-python-development-course/">Start learning</a><a href="{{relative_path}}about/">About</a><a href="{{relative_path}}sitemap.xml">Sitemap</a><a href="{{relative_path}}llms.txt">llms.txt</a><a href="https://robertdevore.com/">Robert DeVore</a></nav>
</footer>
<script src="{{relative_path}}assets/sitekit/sitekit.js"></script>
<script src="{{relative_path}}assets/js/docs.js"></script>
</body>
</html>
